[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain-matching-baselines"
version = "0.1.0"
description = "Pixel-coordinate TERCOM, ICCP and particle-filter baselines"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "contourpy>=1.1",
    "matplotlib>=3.7",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["baselines*", "utils*", "scripts*"]

[tool.setuptools.package-data]
baselines = ["*.yaml"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".codex_tmp"]
cache-dir = ".codex_tmp/ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I"]
